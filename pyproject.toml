[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-layer-bench"
version = "0.1.0"
description = "Benchmark harness for System-One style decision layers (TypeSafe Jev / djev / openjev) driving a simulated robot arm via typed primitives."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2",  # ROS 2 Jazzy and opencv-python-headless 4.10 need numpy 1.x
    "mujoco>=3.3",
    "httpx>=0.27",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
report = ["matplotlib>=3.8"]
# real robot (dlb/real): OpenCV for the USB cameras (headless build that still accepts numpy<2), scipy for the
# vendored analytic IK. rclpy comes from the ROS 2 installation (source ~/ros2_ws/install/setup.bash).
real = ["opencv-python-headless==4.10.0.84", "scipy>=1.11"]
# voice instructions (dlb/voice): Silero VAD runs on onnxruntime
voice = ["onnxruntime==1.20.1"]

[project.scripts]
dlb = "dlb.cli:main"

[tool.setuptools.packages.find]
include = ["dlb*"]

[tool.setuptools.package-data]
"dlb.sim" = ["assets/omx/*.xml", "assets/omx/LICENSE", "assets/omx/assets/*.stl"]

[tool.ruff]
line-length = 110
extend-exclude = ["dlb/real/omx_kinematics.py"]  # vendored from the OMX-F port of Show-Harness
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# a ROS 2-sourced shell adds launch_testing / launch_ros plugins, whose hooks fail on pytest 9
addopts = "-p no:launch_testing -p no:launch_ros"
